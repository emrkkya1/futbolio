name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  offline-engine:
    name: Offline core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare test dependencies
        run: |
          bash ./gradlew prepareOfflineTestDependencies --no-daemon --console=plain
          bash ./gradlew --stop
      - name: Run core tests with no external network
        # The test JVMs have loopback only. --offline alone only limits Gradle downloads.
        run: sudo --preserve-env=JAVA_HOME,ANDROID_HOME,ANDROID_SDK_ROOT,PATH env GRADLE_USER_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}" unshare --net bash -c 'ip link set lo up; bash ./gradlew :domain:test :application:test :engine:check --offline --no-daemon --console=plain'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-core-tests
          path: |
            domain/build/reports/tests/
            application/build/reports/tests/
            engine/build/reports/tests/

  unit-and-lint:
    name: Host unit tests and Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release detection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Check whitespace
        run: git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol show --format= --check HEAD
      - name: Unit tests, version checks and lint (no UI or live tests)
        run: bash ./gradlew :desktop:headlessTest :android:testDebugUnitTest :android:verifyVersioning :android:lintDebug :android:lintRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-and-lint
          path: |
            desktop/build/reports/tests/headlessTest/
            android/build/reports/tests/
            android/build/reports/lint-results-*

  version:
    name: Detect new main version
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version bump or manually retry an unpublished version
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
        run: python3 scripts/ci/release_version.py

  desktop-package:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux AppImage
            artifact: desktop-linux
          - os: windows-latest
            platform: Windows exe
            artifact: desktop-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux UI tests and bundled runtime
        if: runner.os == 'Linux'
        env:
          SKIKO_RENDER_API: SOFTWARE
        run: xvfb-run -a bash ./gradlew :desktop:test :desktop:createDistributable --no-daemon --console=plain
      - name: Package and test AppImage without FUSE
        if: runner.os == 'Linux'
        run: |
          bash scripts/desktop/package_appimage.sh
          version="$(sed -n 's/^futbolioVersion=//p' gradle.properties)"
          python3 scripts/desktop/smoke_native.py "dist/desktop/futbolio-v${version}-linux-x86_64.AppImage" --appimage --version "$version"
      - name: Configure Windows installer toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
          }
          if (-not $wix) { throw "WiX 3 candle.exe is required by JDK 21 jpackage" }
          $wix.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Windows tests and exe installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./gradlew.bat :desktop:headlessTest :desktop:createDistributable :desktop:packageExe --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          $version = ((Get-Content gradle.properties | Select-String '^futbolioVersion=').Line -split '=')[1]
          python scripts/desktop/smoke_native.py desktop/build/compose/binaries/main/app/Futbolio/Futbolio.exe --version $version
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows launcher failed" }
          New-Item -ItemType Directory -Force dist/desktop | Out-Null
          $installer = @(Get-ChildItem desktop/build/compose/binaries/main/exe/*.exe)
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer" }
          Copy-Item $installer[0] "dist/desktop/futbolio-v$version-windows-x86_64.exe"
      - name: Desktop asset checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          for path in Path('dist/desktop').iterdir():
              if path.suffix in ('.AppImage', '.exe'):
                  path.with_name(path.name + '.sha256').write_text(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/desktop/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}-reports
          path: |
            desktop/build/reports/
            desktop/build/compose/logs/

  build-apk:
    name: Android APK
    # Version detection is quick; packaging must not wait for tests or desktop
    # packages. Publication below is the gate, not the build itself.
    needs: [version]
    if: always() && !cancelled() && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read product version
        run: echo "VERSION=$(sed -n 's/^futbolioVersion=//p' gradle.properties)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android release signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/futbolio-release.keystore"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          FUTBOLIO_KEYSTORE: ${{ runner.temp }}/futbolio-release.keystore
          FUTBOLIO_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FUTBOLIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FUTBOLIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew :android:assembleRelease --no-daemon --console=plain
          mkdir -p dist/release
          cp android/build/outputs/apk/release/android-release.apk "dist/release/futbolio-v${VERSION}.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify "dist/release/futbolio-v${VERSION}.apk"
      - name: Build PR debug APK (no release secrets)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          bash ./gradlew :android:assembleDebug --no-daemon --console=plain
          mkdir -p dist/release
          cp android/build/outputs/apk/debug/android-debug.apk "dist/release/futbolio-v${VERSION}-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify "dist/release/futbolio-v${VERSION}-debug.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/futbolio-release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/release/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish tested application release
    needs: [version, offline-engine, unit-and-lint, desktop-package, build-apk]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: application-release-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/release
      - name: Publish APK, AppImage, exe and verified checksums together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum --check ./*.sha256
          sha256sum "futbolio-v${VERSION}.apk" > "futbolio-v${VERSION}.apk.sha256"
          gh release create "v${VERSION}" ./* --draft --target "$GITHUB_SHA" \
            --title "Futbolio v${VERSION}" --generate-notes
          gh release edit "v${VERSION}" --draft=false

[versions]
kotlin = "2.4.21"
compose = "1.12.2"
agp = "8.13.2"
coroutines = "1.11.0"
serialization = "1.9.0"
ktor = "3.6.1"
okhttp = "5.3.2"
jsoup = "1.23.2"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-compiler = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
android-compose-bom = { module = "androidx.compose:compose-bom", version = "2025.10.01" }
android-compose-ui = { module = "androidx.compose.ui:ui" }
android-compose-material = { module = "androidx.compose.material3:material3" }
android-compose-tooling = { module = "androidx.compose.ui:ui-tooling-preview" }
tv-material = { module = "androidx.tv:tv-material", version = "1.0.1" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.4" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.9.4" }
desktop-material = { module = "org.jetbrains.compose.material3:material3", version = "1.9.0" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
